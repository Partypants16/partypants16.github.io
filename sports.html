<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="theme.js"></script>
    <title>Coming Soon | Parth</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏰</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f0f0f0;
            --card-bg: #ffffff;
            --text: #333;
            --muted-text: #666;
            --link: #1464c0;
        }

        :root[data-theme="dark"] {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #eeeeee;
            --muted-text: #aaaaaa;
            --link: #6ea8ff;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            transition: background-color .3s ease;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .development-notice {
            text-align: center;
            padding: 40px;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            transition: background-color .3s ease;
        }

        h1 {
            color: var(--text);
            margin: 0 0 10px 0;
        }

        p {
            color: var(--muted-text);
            margin: 0;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--link);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background: #111;
            color: white;
            border-top: 3px solid #e0f7fa;
        }
    </style>
</head>

<body>
    <main>
        <div class="development-notice">
            <h1>🚧 <span id="feature-name">This section</span> is under development</h1>
            <p>Please check back soon!</p>
            <a class="back-link" href="index.html">&larr; Back to Home</a>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Parth</p>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const feature = params.get("feature");
        if (feature) {
            document.getElementById("feature-name").textContent = feature;
            document.title = feature + " | Coming Soon";
        }
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>

</html>
