<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script src="settings.js"></script>
    <script src="motion.js"></script>
    <title>Wallpaper</title>
    <meta name="description" content="Live, drawn and video wallpapers behind a clock, the date and a quote. Weather, sunrise, F1, what Parth's playing, and more.">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏰</text></svg>">
    <link rel="stylesheet" href="wallpaper.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="motion.css">

    <!-- The engine first, then one file per wallpaper (picker order within each group) -->
    <script src="wallpapers/quotes.js" defer></script>
    <script src="wallpaper.js" defer></script>
    <script src="wallpapers/weather.js" defer></script>
    <script src="wallpapers/day-night.js" defer></script>
    <script src="wallpapers/f1.js" defer></script>
    <script src="wallpapers/now-playing.js" defer></script>
    <script src="wallpapers/now-listening.js" defer></script>
    <script src="wallpapers/night-drive.js" defer></script>
    <script src="wallpapers/aurora.js" defer></script>
    <script src="wallpapers/rain-glass.js" defer></script>
    <script src="wallpapers/starfield.js" defer></script>
    <script src="wallpapers/loveless.js" defer></script>
    <script src="wallpapers/videos.js" defer></script>
    <script src="wallpapers/start-page.js" defer></script>
    <script src="wallpapers/focus.js" defer></script>
    <script src="wallpapers/countdown-dates.js" defer></script>
    <script src="wallpapers/countdowns.js" defer></script>
    <script src="service-status.js" defer></script>
</head>

<body>

    <header>
        <nav>
            <p class="logo"><a href="index.html">PS</a></p>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="wallpaper.html" aria-current="page">Wallpaper</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="gaming.html">Games</a></li>
                <li><a href="movies.html">Movies</a></li>
            </ul>
            <button class="settings-toggle" id="settingsToggle" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsPanel"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="3.34 3.34"/><circle cx="12" cy="12" r="5.2" fill="none" stroke="currentColor" stroke-width="4.4"/></svg></button>
        </nav>
    </header>

    <!-- The wallpaper itself (filled by wallpaper.js) -->
    <div class="wp-stage" id="stage" aria-hidden="true"></div>

    <!-- Darkens the wallpaper so the clock stays readable (Settings → Darken) -->
    <div class="overlay"></div>

    <div class="content" id="content">
        <h1 class="clock" id="clock">00:00</h1>
        <p class="date" id="date"></p>
        <div class="wp-widget" id="widget" hidden></div>
        <blockquote class="quote" id="quote" hidden></blockquote>
    </div>

    <div class="wp-buttons">
        <button class="wp-btn" id="ambientBtn" type="button" aria-label="Ambient mode" aria-pressed="false" title="Ambient mode: full screen, controls hide, screen stays on (F)">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        </button>
        <button class="wp-btn" id="openModal" type="button" aria-label="Choose a wallpaper" aria-haspopup="dialog" aria-controls="wallpaperModal" title="Choose a wallpaper">🎨</button>
    </div>

    <div class="modal" id="wallpaperModal" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
        <div class="modal-content">
            <div class="picker-head">
                <h2 id="pickerTitle">Choose a wallpaper</h2>
                <button class="close" id="closeModal" type="button" aria-label="Close">&times;</button>
            </div>
            <div class="picker-body" id="pickerBody"></div>
            <div class="picker-foot">
                <button class="picker-copy" id="copyLink" type="button">Copy a link to this wallpaper</button>
                <span class="picker-note" id="copyNote" role="status"></span>
                <span class="picker-keys">← → flip through · F ambient mode</span>
            </div>
        </div>
    </div>

    <noscript><p class="noscript">The wallpapers need JavaScript.</p></noscript>

</body>

</html>
