<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="hinglish.js"></script>
  <script src="i18n.js"></script>
  <script src="settings.js"></script>
  <script src="motion.js"></script>
  <script src="topbar.js" defer></script>
  <title>Music Explorer | Parth</title>
  <meta name="description" content="Explore Parth's Spotify history since 2017: every artist and song by year, when he played them, and two years side by side.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>">
  <link rel="stylesheet" href="movies.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="motion.css">
  <link rel="stylesheet" href="react-pages.css">
</head>

<body>
  <header>
    <nav>
      <p class="logo"><a href="profile.html" title="Profile">PS</a></p>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="gaming.html">Games</a></li>
        <li><a href="media.html" aria-current="page">Media</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="homelab.html">Home Lab</a></li>
      </ul>
      <button class="settings-toggle" id="settingsToggle" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsPanel"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="3.34 3.34"/><circle cx="12" cy="12" r="5.2" fill="none" stroke="currentColor" stroke-width="4.4"/></svg></button>
    </nav>
  </header>

  <!-- Everything inside #rx-root is drawn by music-explorer.js, a React app built from
       react-src/ (npm run build). Edit the source there, not the built file. -->
  <main class="rx">
    <a class="back-link" id="rx-back" href="music.html">&larr; Music</a>
    <div id="rx-root"></div>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Parth</p>
  </footer>

  <script src="music-people.js"></script>
  <script>
    // Load the chosen person's two data files (?for=aaron; Parth's without it), then
    // the app. async = false keeps them in order. The back link returns to their charts.
    (function () {
      const people = typeof MUSIC_PEOPLE !== "undefined" ? MUSIC_PEOPLE : [];
      const asked = new URLSearchParams(location.search).get("for");
      const person = people.find(p => p.key === asked) || people.find(p => p.self) || people[0];
      const files = person ? [person.data, person.explorer] : ["music-data.js", "music-explorer-data.js"];
      if (person && !person.self) document.getElementById("rx-back").href = "music.html?for=" + encodeURIComponent(person.key);
      for (const src of files.concat("music-explorer.js")) {
        const script = document.createElement("script");
        script.src = src;
        script.async = false;
        document.body.appendChild(script);
      }
    })();
  </script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>

</html>
