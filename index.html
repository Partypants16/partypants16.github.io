<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="hinglish.js"></script>
  <script src="i18n.js"></script>
  <script src="settings.js"></script>
  <script src="motion.js"></script>
  <script src="topbar.js" defer></script>
  <title>Parth | Home</title>
  <meta name="description" content="Parth's personal home page - projects, gaming, self-hosted services and more.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏰</text></svg>">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="motion.css">
  <link rel="stylesheet" href="home-diagram.css">
</head>

<body>
  <header>
    <nav>
      <p class="logo"><a href="profile.html" title="Profile">PS</a></p>
      <ul>
        <li><a href="index.html" aria-current="page">Home</a></li>
        <li><a href="gaming.html">Games</a></li>
        <li><a href="media.html">Media</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="homelab.html">Home Lab</a></li>
      </ul>
      <button class="settings-toggle" id="settingsToggle" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsPanel"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="3.34 3.34"/><circle cx="12" cy="12" r="5.2" fill="none" stroke="currentColor" stroke-width="4.4"/></svg></button>
    </nav>
  </header>

  <main class="hd">
    <!-- The Palace map: a centre node with Melbourne's clock and weather, wired to the rest of the site.
         Built by home-diagram.js (data: the service-status gist's weather.json and status.json, data/car-events.json). -->
    <div class="hd-stage" role="region" aria-label="The Palace map">
      <svg class="hd-wires" aria-hidden="true"></svg>

      <button type="button" class="hd-node hd-node--hub" data-node="melbourne" aria-haspopup="dialog" aria-controls="hd-panel">
        <span class="hd-icon" aria-hidden="true">PS</span>
        <span class="hd-title" translate="no">Parth's Palace</span>
        <span class="hd-clock" data-clock="seconds"></span>
        <span class="hd-weather-line"><span translate="no">Melbourne</span> · <span data-weather>…</span></span>
      </button>

      <button type="button" class="hd-node" data-node="play" style="--hd-colour:#e5484d" aria-haspopup="dialog" aria-controls="hd-panel">
        <span class="hd-icon" aria-hidden="true">🎮</span>
        <span class="hd-title">Play</span>
        <span class="hd-sub">My games, in your browser</span>
      </button>

      <button type="button" class="hd-node" data-node="media" style="--hd-colour:#8e4ec6" aria-haspopup="dialog" aria-controls="hd-panel">
        <span class="hd-icon" aria-hidden="true">🎬</span>
        <span class="hd-title">Watch &amp; Listen</span>
        <span class="hd-sub">Movies, music and wallpapers</span>
      </button>

      <button type="button" class="hd-node" data-node="cars" style="--hd-colour:#f76b15" aria-haspopup="dialog" aria-controls="hd-panel">
        <span class="hd-icon" aria-hidden="true">🏎️</span>
        <span class="hd-title">Car Shows</span>
        <span class="hd-sub">See what's coming up</span>
      </button>

      <button type="button" class="hd-node" data-node="homelab" style="--hd-colour:#1464c0" aria-haspopup="dialog" aria-controls="hd-panel">
        <span class="hd-icon" aria-hidden="true">🏠</span>
        <span class="hd-title">Home Lab</span>
        <span class="hd-sub">Self-hosted services</span>
      </button>

      <button type="button" class="hd-node" data-node="projects" style="--hd-colour:#30a46c" aria-haspopup="dialog" aria-controls="hd-panel">
        <span class="hd-icon" aria-hidden="true">🛠️</span>
        <span class="hd-title">Projects</span>
        <span class="hd-sub">The stories behind them</span>
      </button>

      <button type="button" class="hd-node" data-node="about" style="--hd-colour:#ffb224" aria-haspopup="dialog" aria-controls="hd-panel">
        <span class="hd-icon" aria-hidden="true">👋</span>
        <span class="hd-title">About me</span>
        <span class="hd-sub">Who I am and how to reach me</span>
      </button>

      <p class="hd-hint">Click a node to open it. On a computer you can drag them around.</p>
    </div>

    <aside class="hd-panel" id="hd-panel" role="dialog" aria-label="Details" aria-hidden="true">
      <div class="hd-panel-head">
        <span class="hd-icon hd-panel-icon" aria-hidden="true"></span>
        <h2></h2>
        <button type="button" class="hd-close" aria-label="Close">×</button>
      </div>
      <div class="hd-panel-body"></div>
    </aside>
  </main>

  <script src="home-diagram.js"></script>
</body>

</html>
